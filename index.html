<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Health Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/openpgp@5.11.2/dist/openpgp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0b0d11;
      --surface: #151922;
      --surface-2: #1e2330;
      --border: rgba(255,255,255,0.08);
      --text: #f0f2f5;
      --text-2: #9aa3b2;
      --accent: #22d3ee;
      --accent-2: #818cf8;
      --success: #4ade80;
      --warning: #facc15;
      --danger: #fb7185;
      --radius: 18px;
      --shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 15px;
    }
    .hidden { display: none !important; }

    /* Login */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 30%, rgba(34,211,238,0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(129,140,248,0.12) 0%, transparent 40%),
        var(--bg);
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: rgba(21,25,34,0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 28px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .login-card h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .login-card p {
      margin: 0 0 28px;
      color: var(--text-2);
      font-size: 0.92rem;
    }
    .lock-icon {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 4px 20px rgba(34,211,238,0.25);
    }
    .input-group { position: relative; margin-bottom: 16px; }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34,211,238,0.12);
    }
    button.primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #000;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button.primary:active { transform: scale(0.98); }
    button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 1.2em;
    }

    /* Dashboard */
    .dashboard {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .dashboard-header h1 { margin: 0; font-size: 1.3rem; font-weight: 700; }
    .dashboard-header .date { color: var(--text-2); font-size: 0.9rem; }
    .logout-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-2);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-2);
      margin: 0 0 14px;
      font-weight: 600;
    }

    /* Macro cards */
    .macro-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 640px) { .macro-grid { grid-template-columns: repeat(4, 1fr); } }
    .macro-card {
      background: var(--surface-2);
      border-radius: 14px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }
    .macro-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--accent);
      opacity: 0.8;
    }
    .macro-card.protein::before { background: var(--success); }
    .macro-card.carbs::before { background: var(--warning); }
    .macro-card.fat::before { background: var(--danger); }
    .macro-label { font-size: 0.8rem; color: var(--text-2); margin-bottom: 4px; }
    .macro-value { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
    .macro-unit { font-size: 0.75rem; color: var(--text-2); font-weight: 500; }
    .macro-bar-bg {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .macro-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
    }
    .macro-card.kcal .macro-bar-fill { background: var(--accent); }
    .macro-card.protein .macro-bar-fill { background: var(--success); }
    .macro-card.carbs .macro-bar-fill { background: var(--warning); }
    .macro-card.fat .macro-bar-fill { background: var(--danger); }

    /* Body metrics */
    .body-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .body-item {
      background: var(--surface-2);
      border-radius: 14px;
      padding: 14px;
    }
    .body-item .label { font-size: 0.8rem; color: var(--text-2); margin-bottom: 4px; }
    .body-item .value { font-size: 1.3rem; font-weight: 700; }
    .body-item .delta {
      font-size: 0.75rem;
      margin-top: 4px;
      color: var(--text-2);
    }
    .delta.up { color: var(--danger); }
    .delta.down { color: var(--success); }

    /* Meals */
    .date-picker {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .date-picker select, .date-picker input[type="date"], .date-picker button {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    .date-picker input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
    .date-picker button { cursor: pointer; }
    .meal-section { margin-bottom: 14px; }
    .meal-type {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .meal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
    }
    .meal-item:last-child { border-bottom: none; }
    .meal-name { color: var(--text); }
    .meal-qty { color: var(--text-2); font-size: 0.8rem; margin-left: 6px; }
    .meal-cals { color: var(--text-2); font-size: 0.85rem; }

    /* Section totals */
    .section-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 10px;
      font-size: 0.9rem;
    }
    .section-total strong { color: var(--text); }

    /* Recovery */
    .recovery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 640px) { .recovery-grid { grid-template-columns: repeat(3, 1fr); } }
    .recovery-item {
      background: var(--surface-2);
      border-radius: 14px;
      padding: 14px;
    }
    .recovery-item .label { font-size: 0.75rem; color: var(--text-2); margin-bottom: 4px; }
    .recovery-item .value { font-size: 1.2rem; font-weight: 700; }
    .readiness-score {
      width: 64px; height: 64px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: 700;
      margin-bottom: 8px;
      background: conic-gradient(var(--accent) calc(var(--score) * 10%), var(--surface-2) 0);
    }

    /* Charts */
    .chart-container {
      position: relative;
      height: 220px;
      margin-top: 8px;
    }
    .chart-tabs {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .chart-tab {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-2);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .chart-tab.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* Workouts */
    .workout-list { display: flex; flex-direction: column; gap: 10px; }
    .workout-item {
      background: var(--surface-2);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .workout-name { font-weight: 600; }
    .workout-meta { color: var(--text-2); font-size: 0.8rem; margin-top: 2px; }
    .workout-cals { font-size: 0.9rem; color: var(--accent); }

    /* Phase progress */
    .phase-bar-bg {
      height: 10px;
      background: var(--surface-2);
      border-radius: 5px;
      overflow: hidden;
      margin-top: 10px;
    }
    .phase-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 5px;
      transition: width 0.6s ease;
    }

    /* Loading */
    .loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; gap: 16px; color: var(--text-2);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .muted { color: var(--text-2); }
    .empty-state { text-align: center; padding: 30px 0; color: var(--text-2); font-size: 0.9rem; }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>加载中...</div>
  </div>

  <!-- Login Screen -->
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="lock-icon">🔒</div>
      <h1>Health Dashboard</h1>
      <p>数据已加密，请输入密码解锁</p>
      <div class="input-group">
        <input type="password" id="password" placeholder="输入密码" autocomplete="off">
      </div>
      <button class="primary" id="unlock-btn">解锁</button>
      <div class="error-msg" id="login-error"></div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="dashboard hidden">
    <div class="dashboard-header">
      <div>
        <h1 id="greeting">Hello</h1>
        <div class="date" id="today-date"></div>
      </div>
      <button class="logout-btn" id="logout-btn">退出</button>
    </div>

    <!-- Macro Cards -->
    <div class="card">
      <div class="card-title">今日摄入</div>
      <div class="macro-grid" id="macro-cards"></div>
    </div>

    <!-- Meal Log -->
    <div class="card">
      <div class="card-title">饮食记录</div>
      <div class="date-picker">
        <input type="date" id="meal-date-input">
        <button id="prev-day">← 前一天</button>
        <button id="next-day">后一天 →</button>
      </div>
      <div id="meal-content"></div>
      <div class="section-total">
        <span>当日累计</span>
        <span id="meal-total"></span>
      </div>
    </div>

    <!-- Body Metrics -->
    <div class="card">
      <div class="card-title">身体指标</div>
      <div class="body-grid" id="body-metrics"></div>
    </div>

    <!-- Phase Progress -->
    <div class="card">
      <div class="card-title">阶段进度</div>
      <div id="phase-info" class="muted"></div>
      <div class="phase-bar-bg"><div class="phase-bar-fill" id="phase-fill"></div></div>
    </div>

    <!-- Trends -->
    <div class="card">
      <div class="card-title">趋势</div>
      <div class="chart-tabs">
        <button class="trend-tab chart-tab active" data-period="7">7 天</button>
        <button class="trend-tab chart-tab" data-period="30">30 天</button>
      </div>
      <div id="charts-container">
        <div class="chart-container"><canvas id="weight-chart"></canvas></div>
        <div class="chart-container"><canvas id="calories-chart"></canvas></div>
      </div>
    </div>

    <!-- Workouts -->
    <div class="card">
      <div class="card-title">训练记录</div>
      <div class="chart-tabs">
        <button class="workout-tab chart-tab active" data-period="7">7 天</button>
        <button class="workout-tab chart-tab" data-period="30">30 天</button>
      </div>
      <div class="workout-list" id="workout-list"></div>
    </div>
  </div>

  <script>
    (function() {
      const APP = { data: null, charts: {} };

      function $(id) { return document.getElementById(id); }

      function formatNum(n, digits=1) {
        if (n === null || n === undefined || isNaN(n)) return '—';
        return Number(n).toFixed(digits);
      }

      function show(id) { $(id).classList.remove('hidden'); }
      function hide(id) { $(id).classList.add('hidden'); }

      async function loadEncryptedData() {
        // Cache-bust so GitHub Pages serves the latest data.enc
        const url = `data.enc?v=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('无法加载加密数据');
        return await res.text();
      }

      async function decrypt(armoredData, password) {
        const privateKeyArmored = $('pgp-private-key').textContent.trim();
        const privateKey = await openpgp.decryptKey({
          privateKey: await openpgp.readPrivateKey({ armoredKey: privateKeyArmored }),
          passphrase: password
        });
        const message = await openpgp.readMessage({ armoredMessage: armoredData });
        const { data: decrypted } = await openpgp.decrypt({
          message,
          decryptionKeys: privateKey
        });
        return JSON.parse(decrypted);
      }

      function renderMacros(today, targets) {
        const m = today.macros || {kcal:0, protein_g:0, carbs_g:0, fat_g:0};
        const items = [
          { key: 'kcal', label: '热量', unit: 'kcal', cls: 'kcal', target: targets.kcal },
          { key: 'protein_g', label: '蛋白质', unit: 'g', cls: 'protein', target: targets.protein_g },
          { key: 'carbs_g', label: '碳水', unit: 'g', cls: 'carbs', target: targets.carbs_g },
          { key: 'fat_g', label: '脂肪', unit: 'g', cls: 'fat', target: targets.fat_g },
        ];
        $('macro-cards').innerHTML = items.map(it => {
          const v = m[it.key] || 0;
          const pct = Math.min(100, Math.max(0, (v / it.target) * 100));
          return `
            <div class="macro-card ${it.cls}">
              <div class="macro-label">${it.label}</div>
              <div class="macro-value">${formatNum(v, 0)}<span class="macro-unit"> / ${it.target}${it.unit}</span></div>
              <div class="macro-bar-bg"><div class="macro-bar-fill" style="width:${pct}%"></div></div>
            </div>
          `;
        }).join('');
      }

      function renderMeals(data) {
        const dates = data.history.dates;
        const mealsByDate = data.history._mealsByDate || {};
        const input = $('meal-date-input');
        if (dates.length) {
          input.min = dates[0];
          input.max = dates[dates.length - 1];
        }
        input.value = data.today.date;

        function renderDate(date) {
          const dayMeals = mealsByDate[date] || {};
          const total = data.history.macros[data.history.dates.indexOf(date)] || {kcal:0, protein_g:0, carbs_g:0, fat_g:0};
          const order = ['早餐','早加餐','午餐','下午加餐','晚餐','晚加餐','加餐','上午加餐','其他'];
          const known = new Set(order);
          const present = Object.keys(dayMeals);
          const knownTypes = present.filter(t => known.has(t)).sort((a,b) => order.indexOf(a)-order.indexOf(b));
          const otherTypes = present.filter(t => !known.has(t)).sort();
          const types = [...knownTypes, ...otherTypes];
          let html = '';
          if (types.length === 0) {
            html = '<div class="empty-state">当日无饮食记录</div>';
          } else {
            for (const t of types) {
              html += `<div class="meal-section"><div class="meal-type">${t}</div>`;
              for (const item of dayMeals[t]) {
                html += `
                  <div class="meal-item">
                    <div><span class="meal-name">${item.item}</span><span class="meal-qty">${item.qty_text || ''}</span></div>
                    <div class="meal-cals">${formatNum(item.kcal, 0)} kcal</div>
                  </div>`;
              }
              html += '</div>';
            }
          }
          $('meal-content').innerHTML = html;
          $('meal-total').innerHTML = `${formatNum(total.kcal,0)} kcal · 蛋白 ${formatNum(total.protein_g,1)}g · 碳水 ${formatNum(total.carbs_g,1)}g · 脂肪 ${formatNum(total.fat_g,1)}g`;
        }

        function stepDate(delta) {
          const idx = data.history.dates.indexOf(input.value);
          const newIdx = idx + delta;
          if (newIdx >= 0 && newIdx < data.history.dates.length) {
            input.value = data.history.dates[newIdx];
            renderDate(input.value);
          }
        }

        renderDate(data.today.date);
        input.addEventListener('change', () => renderDate(input.value));
        $('prev-day').addEventListener('click', () => stepDate(-1));
        $('next-day').addEventListener('click', () => stepDate(1));
      }

      function renderBodyMetrics(data) {
        const today = data.today.body || {};
        const hist = data.history.body;
        const lastIdx = hist.length - 1;
        const prev = lastIdx > 0 ? hist[lastIdx-1] : null;

        function delta(v, pv) {
          if (!v || !pv) return '';
          const d = v - pv;
          const cls = d > 0 ? 'up' : (d < 0 ? 'down' : '');
          const sign = d > 0 ? '+' : '';
          return `<div class="delta ${cls}">${sign}${formatNum(d,2)} vs 上次</div>`;
        }

        $('body-metrics').innerHTML = `
          <div class="body-item">
            <div class="label">体重</div>
            <div class="value">${formatNum(today.weight_kg, 2)} <span style="font-size:0.8rem;color:var(--text-2)">kg</span></div>
            ${delta(today.weight_kg, prev?.weight_kg)}
          </div>
          <div class="body-item">
            <div class="label">体脂率</div>
            <div class="value">${formatNum(today.body_fat_pct, 1)}<span style="font-size:0.8rem;color:var(--text-2)">%</span></div>
            ${delta(today.body_fat_pct, prev?.body_fat_pct)}
          </div>
          <div class="body-item">
            <div class="label">肌肉量</div>
            <div class="value">${formatNum(today.muscle_mass_kg, 1)} <span style="font-size:0.8rem;color:var(--text-2)">kg</span></div>
            ${delta(today.muscle_mass_kg, prev?.muscle_mass_kg)}
          </div>
          <div class="body-item">
            <div class="label">脂肪量</div>
            <div class="value">${formatNum(today.fat_mass_kg, 1)} <span style="font-size:0.8rem;color:var(--text-2)">kg</span></div>
            ${delta(today.fat_mass_kg, prev?.fat_mass_kg)}
          </div>
        `;
      }

      function renderPhase(data) {
        const p = data.phase || {};
        const start = p.start ? new Date(p.start) : null;
        const end = p.end ? new Date(p.end) : null;
        if (start && end) {
          const now = new Date(data.today.date);
          const total = end - start;
          const elapsed = now - start;
          const pct = Math.max(0, Math.min(100, (elapsed / total) * 100));
          const daysLeft = Math.ceil((end - now) / (1000*60*60*24));
          $('phase-info').innerHTML = `阶段 ${p.phase || '1'} · ${p.start} 至 ${p.end} · 剩余 ${daysLeft} 天`;
          $('phase-fill').style.width = pct + '%';
        } else {
          $('phase-info').textContent = '阶段信息未配置';
          $('phase-fill').style.width = '0%';
        }
      }

      function renderWorkouts(data, period) {
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - period + 1);
        const all = data.workouts_60d || [];
        const filtered = all.filter(w => new Date(w.date) >= cutoff).sort((a,b) => b.date.localeCompare(a.date) || 0);

        if (filtered.length === 0) {
          $('workout-list').innerHTML = '<div class="empty-state">该时段无训练记录</div>';
          return;
        }

        // Group by date
        const byDate = {};
        for (const w of filtered) {
          if (!byDate[w.date]) byDate[w.date] = [];
          byDate[w.date].push(w);
        }

        let html = '';
        for (const date of Object.keys(byDate).sort((a,b) => b.localeCompare(a))) {
          const dayWorkouts = byDate[date];
          const isToday = date === data.today.date;
          html += `<div style="margin-bottom:14px;"><div style="font-size:0.8rem;color:var(--accent);margin-bottom:6px;font-weight:600;">${date}${isToday ? ' · 今天' : ''}</div>`;
          for (const w of dayWorkouts) {
            const isRun = /跑|run|marathon|马拉松|5k|10k|半马/i.test(w.name || w.type || '');
            const dist = isRun && w.distance_km ? ` · ${Number(w.distance_km).toFixed(2)} km` : '';
            html += `
              <div class="workout-item">
                <div>
                  <div class="workout-name">${w.name || w.type || '训练'}</div>
                  <div class="workout-meta">${w.duration_min || 0} 分钟${dist}</div>
                </div>
                <div class="workout-cals">${w.calories || 0} kcal</div>
              </div>`;
          }
          html += '</div>';
        }
        $('workout-list').innerHTML = html;
      }

      function destroyCharts() {
        Object.values(APP.charts).forEach(c => c && c.destroy());
        APP.charts = {};
      }

      function renderCharts(data, period) {
        destroyCharts();
        const labels = data.history.dates.slice(-period);
        const body = data.history.body.slice(-period);
        const macros = data.history.macros.slice(-period);
        const targetsByDate = data.daily_targets || {};

        const weights = body.map(b => b?.weight_kg || null);
        const bodyFat = body.map(b => b?.body_fat_pct || null);

        const ctxW = $('weight-chart').getContext('2d');
        APP.charts.weight = new Chart(ctxW, {
          type: 'line',
          data: {
            labels,
            datasets: [
              { label: '体重 (kg)', data: weights, borderColor: '#22d3ee', backgroundColor: 'rgba(34,211,238,0.1)', tension: 0.3, fill: true, pointRadius: 3 },
              { label: '体脂率 (%)', data: bodyFat, borderColor: '#fb7185', backgroundColor: 'rgba(251,113,133,0.05)', tension: 0.3, fill: false, pointRadius: 3, yAxisID: 'y1' }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { labels: { color: '#9aa3b2' } }, title: { display: true, text: '体重 / 体脂率', color: '#9aa3b2', font: { size: 14 } } },
            scales: {
              x: { ticks: { color: '#9aa3b2' }, grid: { color: 'rgba(255,255,255,0.05)' } },
              y: { ticks: { color: '#9aa3b2' }, grid: { color: 'rgba(255,255,255,0.05)' } },
              y1: { position: 'right', ticks: { color: '#fb7185' }, grid: { drawOnChartArea: false } }
            }
          }
        });

        const ctxC = $('calories-chart').getContext('2d');
        const kcals = macros.map(m => m.kcal || null);
        const targetKcals = labels.map(d => (targetsByDate[d] && targetsByDate[d].kcal) ? targetsByDate[d].kcal : 1700);
        const avgTarget = Math.round(targetKcals.reduce((a,b)=>a+b,0) / targetKcals.length) || 1700;
        APP.charts.calories = new Chart(ctxC, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              {
                label: '热量 (kcal)',
                data: kcals,
                backgroundColor: kcals.map((v, i) => v && v > targetKcals[i] ? 'rgba(251,113,133,0.7)' : 'rgba(34,211,238,0.7)'),
                order: 2
              },
              {
                label: `目标 ${avgTarget}`,
                data: targetKcals,
                type: 'line',
                borderColor: '#facc15',
                borderWidth: 2,
                borderDash: [6, 6],
                pointRadius: 0,
                fill: false,
                order: 1
              }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              title: { display: true, text: '每日热量', color: '#9aa3b2', font: { size: 14 } }
            },
            scales: {
              x: { ticks: { color: '#9aa3b2' }, grid: { color: 'rgba(255,255,255,0.05)' } },
              y: { ticks: { color: '#9aa3b2' }, grid: { color: 'rgba(255,255,255,0.05)' } }
            }
          }
        });
      }

      function renderAll() {
        const data = APP.data;
        const today = data.today;
        const hour = new Date().getHours();
        const greeting = hour < 11 ? '早安' : (hour < 17 ? '午安' : '晚上好');
        $('greeting').textContent = `${greeting}, Wayne`;
        $('today-date').textContent = data.today.date;

        renderMacros(today, data.targets);
        renderMeals(data);
        renderBodyMetrics(data);
        renderPhase(data);

        // Trend tabs
        document.querySelectorAll('.trend-tab').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.trend-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCharts(data, parseInt(btn.dataset.period));
          });
        });
        renderCharts(data, 7);

        // Workout tabs
        document.querySelectorAll('.workout-tab').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.workout-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderWorkouts(data, parseInt(btn.dataset.period));
          });
        });
        renderWorkouts(data, 7);

        window.APP = APP; // expose for debugging
      }

      async function doUnlock() {
        const btn = $('unlock-btn');
        const error = $('login-error');
        const password = $('password').value.trim();
        if (!password) { error.textContent = '请输入密码'; return; }
        btn.disabled = true;
        error.textContent = '解密中...';
        try {
          const encrypted = await loadEncryptedData();
          const data = await decrypt(encrypted, password);
          APP.data = data;
          hide('login-screen');
          show('dashboard');
          renderAll();
        } catch (e) {
          window.lastDecryptError = e;
          console.error('Decrypt error:', e);
          error.textContent = '解密失败：密码错误或数据损坏 (' + (e.message || '') + ')';
        } finally {
          btn.disabled = false;
        }
      }

      // Init
      hide('loading');
      show('login-screen');
      $('unlock-btn').addEventListener('click', doUnlock);
      $('password').addEventListener('keydown', e => { if (e.key === 'Enter') doUnlock(); });
      $('logout-btn').addEventListener('click', () => {
        APP.data = null;
        hide('dashboard');
        show('login-screen');
        $('password').value = '';
